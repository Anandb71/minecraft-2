[package]
name = "minecraft-2"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A voxel sandbox ray marched on the GPU"
default-run = "minecraft-2"

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
wgpu = "30.0.1"
winit = "0.30.13"
gilrs = "0.11"
cpal = "0.16"
glam = { version = "0.33.7", features = ["bytemuck"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
rayon = "1.12.0"
pollster = "1.0.1"
bevy_ecs = { version = "0.19.1", default-features = false, features = ["std", "async_executor"] }
puffin = "0.20.0"
png = "0.18.1"
font8x8 = { version = "0.3.1", default-features = false }
log = "0.4"
mc2-core = { path = "crates/mc2-core" }
mc2-game = { path = "crates/mc2-game" }
mc2-gpu = { path = "crates/mc2-gpu" }
mc2-physics = { path = "crates/mc2-physics" }
mc2-fluid = { path = "crates/mc2-fluid" }
mc2-render = { path = "crates/mc2-render" }
mc2-anim = { path = "crates/mc2-anim" }
mc2-audio = { path = "crates/mc2-audio" }
mc2-structure = { path = "crates/mc2-structure" }
mc2-voxel = { path = "crates/mc2-voxel" }
mc2-worldgen = { path = "crates/mc2-worldgen" }

[dependencies]
mc2-audio.workspace = true
mc2-core.workspace = true
mc2-game.workspace = true
bevy_ecs.workspace = true
mc2-gpu.workspace = true
mc2-render.workspace = true
mc2-voxel.workspace = true
mc2-worldgen.workspace = true
wgpu.workspace = true
winit.workspace = true
gilrs.workspace = true
cpal.workspace = true
glam.workspace = true
pollster.workspace = true
log.workspace = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"
codegen-units = 16
